<!DOCTYPE html>

<title>Wedding Budget App</title>

<style>:root{--bg:#fbf4f2;--card:#ffffff;--ink:#3a2b30;--muted:#7a6469;--line:#f0dedb;--accent:#a8435c;--accent-ink:#ffffff;--good:#1f7a5c;--good-bg:#e0f1e8;--warn:#a8540f;--warn-bg:#fbefe2;--bad:#b23a48;--bad-bg:#f9e6e8;--soft:#f7e8e5;--bar:#eccfca;--shadow:0 1px 2px rgba(58,43,48,.06),0 6px 18px rgba(58,43,48,.06)}

*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 90px}

.grid{display:grid;gap:14px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:720px){.g3,.g2{grid-template-columns:1fr}.wrap{padding-bottom:60px}}

.hero .sub{color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700}

.stat .v{font-size:26px;font-weight:800;letter-spacing:-.5px}.stat .l{color:var(--muted);font-size:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.row .main{min-width:0;flex:1}.row .t{font-weight:600;overflow-wrap:anywhere}.row .s{color:var(--muted);font-size:14px}
.amt{font-weight:700;white-space:nowrap}.neg{color:var(--bad)}.pos{color:var(--good)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.btn.small{padding:5px 10px;font-size:14px}.btn.danger{color:var(--bad)}
.btn:hover{filter:brightness(.97)}.actions{display:flex;gap:8px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}.field label{font-size:14px;font-weight:600;color:var(--muted)}
input,select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.inline{display:grid;grid-template-columns:1fr 1.2fr 1.6fr auto;gap:8px;align-items:end}

.bar{height:10px;background:var(--bar);border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}.bar.over i{background:var(--bad)}

td input{padding:6px 8px;max-width:110px;text-align:right}

.steps li.done:before{content:"\2713";background:var(--good-bg);color:var(--good)}
.ovl{position:fixed;inset:0;background:rgba(10,12,30,.55);display:grid;place-items:center;padding:16px;z-index:10}
.modal{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:440px;max-height:92vh;overflow:auto;box-shadow:var(--shadow)}
.modal h2{margin:0 0 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}.seg button{border:0;background:var(--card);padding:8px 14px;cursor:pointer;font-weight:600;color:var(--muted)}.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.tag{font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--soft);color:var(--muted);margin-left:6px}

.afford{border-radius:14px;padding:14px;margin-top:6px}.afford .verdict{font-weight:800;font-size:18px;margin-bottom:4px}
.afford.ok{background:var(--good-bg)}.afford.ok .verdict{color:var(--good)}.afford.wait{background:var(--warn-bg)}.afford.wait .verdict{color:var(--warn)}.afford.no{background:var(--bad-bg)}.afford.no .verdict{color:var(--bad)}

.prow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:6px 0 6px 12px;border-left:3px solid var(--soft);margin:4px 0 4px 2px;font-size:15px}

.tl td.dt{white-space:nowrap;color:var(--muted)}.tl tr.pay td.am{color:var(--bad)}.tl tr.save td.am,.tl tr.in td.am{color:var(--good)}
.chart .zero{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4}.chart .ln1{fill:none}.chart .area{fill:var(--soft)}.chart .dotp{fill:var(--bad)}
.crowd{display:inline-flex;gap:6px}
.rs button{padding:4px 10px;font-size:13px}
input[type=number]{-moz-appearance:textfield}
</style></head>

<script>window.WBA_DEMO=true</script><script>/* Wedding Budget App - calculation engine (no DOM, no storage).
   Money going IN is dollars (numbers). Money coming OUT is integer cents (fields ending in C, or noted). Dates are ISO strings YYYY-MM-DD. */
(function (root) {
  'use strict';

  /* ---------- dates ---------- */
  function toDays(iso) { var p = iso.split('-'); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fromDays(n) { var d = new Date(n * 86400000); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
  function daysInMonth(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
  function mk(y, m, d) { return y + '-' + pad(m) + '-' + pad(Math.min(d, daysInMonth(y, m))); }
  function addMonths(iso, k) {
    var p = iso.split('-'), y = +p[0], m = +p[1], d = +p[2], idx = y * 12 + (m - 1) + k;
    return mk(Math.floor(idx / 12), (idx % 12 + 12) % 12 + 1, d);
  }
  function cents(x) { x = Number(x); if (!isFinite(x)) return 0; return x < 0 ? -Math.round(-x * 100) : Math.round(x * 100); }
  function ceilDiv(a, b) { return Math.floor((a + b - 1) / b); }

  /* ---------- categories (typical share of a wedding budget) ---------- */
  var CATS = [
    { name: 'Venue', pct: 20 }, { name: 'Catering & bar', pct: 25 }, { name: 'Photography & video', pct: 10 }, { name: 'Attire', pct: 8 },
    { name: 'Flowers & decor', pct: 8 }, { name: 'Music & entertainment', pct: 7 }, { name: 'Cake & desserts', pct: 2 }, { name: 'Rings', pct: 3 },
    { name: 'Invitations & stationery', pct: 2 }, { name: 'Hair & makeup', pct: 2 }, { name: 'Transportation', pct: 2 }, { name: 'Officiant & license', pct: 1 },
    { name: 'Favors & gifts', pct: 1 }, { name: 'Other & buffer', pct: 9 }
  ];
  var CAT_NAMES = CATS.map(function (c) { return c.name; });
  function catOf(name) { return CAT_NAMES.indexOf(name) >= 0 ? name : 'Other & buffer'; }

  /* Split a total (in cents) across the categories by their typical share. Exact: the parts always add up to the total. */
  function splitBudget(totalC) {
    var out = {}, used = 0, rem = [];
    CATS.forEach(function (c, i) { var q = Math.floor(totalC * c.pct / 100); out[c.name] = q; used += q; rem.push([(totalC * c.pct) % 100, i]); });
    rem.sort(function (a, b) { return b[0] - a[0] || a[1] - b[1]; });
    for (var i = 0; i < totalC - used; i++) out[CATS[rem[i][1]].name] += 1;
    return out;
  }

  /* ---------- vendors ---------- */
  function guestCount(state) { var g = Math.floor(Number(state.wedding && state.wedding.guests)); return isFinite(g) && g > 0 ? g : 0; }

  /* v: {id,name,category,status,total,perGuest,payments:[{id,label,amount,due,paid,balance}]}
     The payment flagged "balance" is whatever is left after the fixed payments. Per-guest vendors scale with the guest count. */
  function resolveVendor(v, guests) {
    var total = Number(v.perGuest) > 0 ? cents(v.perGuest) * guests : cents(v.total), fixed = 0, seen = false, pays = [];
    (v.payments || []).forEach(function (p) { if (!(p.balance && !seen)) fixed += cents(p.amount); if (p.balance) seen = true; });
    var bal = Math.max(0, total - fixed); seen = false;
    (v.payments || []).forEach(function (p) {
      var isBal = !!p.balance && !seen; if (p.balance) seen = true;
      pays.push({ id: p.id, label: p.label || 'Payment', due: p.due, paid: !!p.paid, balance: isBal, amount: isBal ? bal : cents(p.amount) });
    });
    return { id: v.id, name: v.name, category: catOf(v.category), status: v.status === 'considering' ? 'considering' : 'booked', total: total, payments: pays, overpaid: fixed > total };
  }

  function summary(state, guestsOverride) {
    var g = guestsOverride === undefined ? guestCount(state) : guestsOverride, budget = cents(state.wedding && state.wedding.budget);
    var committed = 0, considering = 0, paid = 0, toPay = 0, cats = {}, vend = [];
    CAT_NAMES.forEach(function (n) { cats[n] = { name: n, budgetC: cents((state.categoryBudgets || {})[n]), committedC: 0, consideringC: 0, remainingC: 0 }; });
    (state.vendors || []).forEach(function (v) {
      var r = resolveVendor(v, g); vend.push(r);
      if (r.status === 'booked') {
        committed += r.total; cats[r.category].committedC += r.total;
        r.payments.forEach(function (p) { if (p.paid) paid += p.amount; else toPay += p.amount; });
      } else { considering += r.total; cats[r.category].consideringC += r.total; }
    });
    var list = CAT_NAMES.map(function (n) { cats[n].remainingC = cats[n].budgetC - cats[n].committedC; return cats[n]; });
    return { guests: g, budgetC: budget, committedC: committed, consideringC: considering, remainingC: budget - committed, paidC: paid, toPayC: toPay,
      perGuestC: g > 0 ? Math.round(committed / g) : null, perGuestAllC: g > 0 ? Math.round((committed + considering) / g) : null,
      cats: list, vendors: vend, catBudgetTotalC: list.reduce(function (a, c) { return a + c.budgetC; }, 0) };
  }

  /* ---------- the savings plan ---------- */
  function contribDate(today, k) { return addMonths(today, k); }
  function nContrib(today, d) { var n = 0; while (n < 600 && contribDate(today, n + 1) <= d) n++; return n; }

  /* Money you have available now: everything saved + gifts already received - what has been paid out. */
  function availableC(state, sm) {
    var rec = 0; (state.gifts || []).forEach(function (g) { if (g.received) rec += cents(g.amount); });
    return cents(state.savings && state.savings.saved) + rec - sm.paidC;
  }

  /* Unpaid payments of booked vendors (overdue ones count as due today) and gifts still to come (past-dated ones count today). */
  function dueItems(state, today, sm) {
    var pays = [], inflows = [];
    sm.vendors.forEach(function (v) {
      if (v.status !== 'booked') return;
      v.payments.forEach(function (p) {
        if (p.paid) return;
        var due = p.due && /^\d{4}-\d{2}-\d{2}$/.test(p.due) ? p.due : today;
        pays.push({ date: due > today ? due : today, due: due, overdue: due < today, amount: p.amount, label: v.name + ' - ' + p.label, vendorId: v.id, payId: p.id });
      });
    });
    (state.gifts || []).forEach(function (g) {
      if (g.received) return;
      var d = g.date && /^\d{4}-\d{2}-\d{2}$/.test(g.date) ? g.date : today;
      inflows.push({ date: d > today ? d : today, amount: cents(g.amount), label: g.name || 'Gift' });
    });
    return { pays: pays, inflows: inflows };
  }

  /* The smallest steady monthly saving (first deposit one month from today) so that the money on hand never falls below zero when a payment is due. */
  function savePlan(state, today, sm) {
    sm = sm || summary(state);
    var avail = availableC(state, sm), di = dueItems(state, today, sm), dates = {}, i;
    di.pays.forEach(function (p) { dates[p.date] = 1; });
    var list = Object.keys(dates).sort(), monthly = 0, gap = 0, binding = null, gapDate = null;
    list.forEach(function (d) {
      var C = 0, I = 0;
      di.pays.forEach(function (p) { if (p.date <= d) C += p.amount; });
      di.inflows.forEach(function (x) { if (x.date <= d) I += x.amount; });
      var need = C - avail - I; if (need <= 0) return;
      var n = nContrib(today, d);
      if (n === 0) { if (need > gap) { gap = need; gapDate = d; } }
      else { var m = ceilDiv(need, n); if (m > monthly) { monthly = m; binding = d; } }
    });
    var totalDue = di.pays.reduce(function (a, p) { return a + p.amount; }, 0), inflowTotal = di.inflows.reduce(function (a, x) { return a + x.amount; }, 0);
    var lastDue = list.length ? list[list.length - 1] : null, firstDue = list.length ? list[0] : null;
    var planned = cents(state.savings && state.savings.monthly), status = 'none';
    if (di.pays.length) {
      if (gap > 0) status = 'short-now';
      else if (planned > 0) status = planned >= monthly ? 'on-track' : 'short';
      else status = 'unset';
    }
    return { monthlyC: monthly, gapNowC: gap, gapDate: gapDate, bindingDate: binding, availableC: avail, totalDueC: totalDue, inflowsC: inflowTotal,
      paymentCount: di.pays.length, firstDue: firstDue, lastDue: lastDue, deposits: lastDue ? nContrib(today, lastDue) : 0,
      plannedC: planned, spareC: planned - monthly, status: status, overdueCount: di.pays.filter(function (p) { return p.overdue; }).length };
  }

  /* Running savings balance from today when you put aside mC each month. */
  function timeline(state, today, mC, sm, plan) {
    sm = sm || summary(state); plan = plan || savePlan(state, today, sm);
    var di = dueItems(state, today, sm), ev = [], seq = 0;
    di.inflows.forEach(function (x) { ev.push({ date: x.date, order: 0, seq: seq++, kind: 'in', label: x.label, amount: x.amount }); });
    di.pays.forEach(function (p) { ev.push({ date: p.date, order: 2, seq: seq++, kind: 'pay', label: p.label, amount: -p.amount, overdue: p.overdue }); });
    if (mC > 0 && plan.lastDue) { for (var k = 1; k <= plan.deposits; k++) ev.push({ date: contribDate(today, k), order: 1, seq: seq++, kind: 'save', label: 'Your monthly saving', amount: mC }); }
    ev.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : a.order - b.order || a.seq - b.seq; });
    var bal = plan.availableC, min = bal; ev.forEach(function (e) { bal += e.amount; e.balance = bal; if (bal < min) min = bal; });
    return { startC: plan.availableC, rows: ev, minC: min, endC: bal };
  }

  /* ---------- calendar ---------- */
  function calendar(state, today) {
    var sm = summary(state), out = [];
    sm.vendors.forEach(function (v) {
      if (v.status !== 'booked') return;
      v.payments.forEach(function (p) { out.push({ date: p.due || today, vendor: v.name, vendorId: v.id, payId: p.id, label: p.label, amountC: p.amount, paid: p.paid, overdue: !p.paid && !!p.due && p.due < today }); });
    });
    out.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.vendor < b.vendor ? -1 : a.vendor > b.vendor ? 1 : 0); });
    return out;
  }

  /* ---------- can we afford this vendor? ---------- */
  function canAffordVendor(state, today, q) {
    var tot = cents(q.total), dep = Math.max(0, Math.min(cents(q.deposit || 0), tot)), pays = [];
    if (dep > 0) pays.push({ id: 'wi-d', label: 'Deposit', amount: dep / 100, due: q.depositDue || today });
    pays.push({ id: 'wi-b', label: 'Balance', balance: true, due: q.balanceDue || q.depositDue || today });
    var hv = { id: 'wi', name: q.name || 'This vendor', category: q.category, status: 'booked', total: tot / 100, perGuest: 0, payments: pays };
    var hs = Object.assign({}, state, { vendors: (state.vendors || []).concat([hv]) });
    var sb = summary(state), sa = summary(hs), pb = savePlan(state, today, sb), pa = savePlan(hs, today, sa);
    var cat = catOf(q.category), cb = sb.cats.filter(function (c) { return c.name === cat; })[0], ca = sa.cats.filter(function (c) { return c.name === cat; })[0];
    var overBudget = sb.budgetC > 0 && sa.committedC > sb.budgetC;
    var catOver = ca.budgetC > 0 && ca.committedC > ca.budgetC;
    var savingsShort = pa.plannedC > 0 && (pa.gapNowC > 0 || pa.monthlyC > pa.plannedC);
    var verdict = overBudget ? 'no' : (catOver || savingsShort) ? 'stretch' : 'yes';
    return { verdict: verdict, overBudget: overBudget, catOver: catOver, savingsShort: savingsShort, category: cat, totalC: tot, depositC: dep,
      committedBeforeC: sb.committedC, committedAfterC: sa.committedC, remainingAfterC: sa.remainingC, budgetC: sb.budgetC,
      catBudgetC: ca.budgetC, catCommittedAfterC: ca.committedC, catRemainingAfterC: ca.remainingC,
      monthlyBeforeC: pb.monthlyC, monthlyAfterC: pa.monthlyC, monthlyDeltaC: pa.monthlyC - pb.monthlyC, plannedC: pa.plannedC,
      gapBeforeC: pb.gapNowC, gapAfterC: pa.gapNowC, perGuestBeforeC: sb.perGuestC, perGuestAfterC: sa.perGuestC,
      perGuestDeltaC: (sb.perGuestC === null || sa.perGuestC === null) ? null : sa.perGuestC - sb.perGuestC };
  }

      (S.gifts.length ? S.gifts.map(function (g) { return '<div class="row"><div class="main"><div class="t">' + esc(g.name) + '</div><div class="s">' + (g.received ? '<span class="pill good">Received</span>' : 'Expected ' + dlabel(g.date)) + '</div></div><div class="amt pos">' + mc(E.cents(g.amount)) + '</div><div class="actions">' + (g.received ? '<button class="btn small" data-act="giftUndo" data-id="' + g.id + '">Undo</button>' : '<button class="btn small primary" data-act="giftGot" data-id="' + g.id + '">Received</button>') + '<button class="btn small" data-act="editGift" data-id="' + g.id + '">Edit</button><button class="btn small danger" data-act="delGift" data-id="' + g.id + '" aria-label="Delete gift">✕</button></div></div>'; }).join('') : '<p class="note">Nothing yet. If parents or relatives are contributing, add it here and your monthly amount drops.</p>') + '</div>';
    h += '<div class="card"><h2>Appearance</h2><div class="seg" role="group" aria-label="Theme"><button data-act="theme" data-t="blush" aria-pressed="' + (S.settings.theme === 'blush') + '">Blush</button><button data-act="theme" data-t="sage" aria-pressed="' + (S.settings.theme === 'sage') + '">Sage</button><button data-act="theme" data-t="midnight" aria-pressed="' + (S.settings.theme === 'midnight') + '">Midnight</button></div>' +
      '<div class="field" style="max-width:200px;margin-top:14px"><label for="cur">Currency symbol</label><input id="cur" data-cur maxlength="3" value="' + esc(S.settings.currency) + '"></div></div>';
    h += '<div class="card"><h2>Your data stays on this device</h2><p>Everything you enter is saved in this browser on this device only. Nothing is uploaded and no account is needed. Browsers can clear saved data, so <b>download a backup now and then</b>. Keep that file somewhere safe: it brings everything back.</p><div class="actions"><button class="btn primary" data-act="backup">Download backup</button><button class="btn" data-act="restore">Restore from backup</button><button class="btn" data-act="csvPay">Export payments (CSV)</button><button class="btn" data-act="csvGuests">Export guest list (CSV)</button></div><input id="restoreFile" type="file" accept=".json,application/json" hidden></div>';
    h += '<div class="card"><h2>How the savings plan works</h2><p class="note">1. Take what you have set aside now. 2. Add gifts you expect, on the dates they arrive. 3. List every unpaid vendor payment with its due date. 4. Find the smallest steady monthly deposit that keeps your balance at or above zero on every payment date. Open <i>Show the math</i> on the Plan page to see each step.</p></div>';
    h += '<div class="card"><h2>Start over</h2><div class="actions"><button class="btn" data-act="loadExample">Load example data</button><button class="btn danger" data-act="clearAll">Erase everything</button></div></div>';
    return h;
  }

  /* ---------- render ---------- */
  var PAGES = [['plan', 'Plan'], ['afford', 'Can we afford it?'], ['vendors', 'Vendors'], ['calendar', 'Payments'], ['budget', 'Budget'], ['guests', 'Guests'], ['setup', 'Setup']];
  function render() {
    document.documentElement.setAttribute('data-theme', S.settings.theme);
    var fn = { plan: pagePlan, afford: pageAfford, vendors: pageVendors, calendar: pageCalendar, budget: pageBudget, guests: pageGuests, setup: pageSetup }[page], scroll = window.scrollY, ae = document.activeElement, aid = ae && ae.id;
    document.getElementById('app').innerHTML = (DEMO ? '<div class="banner" style="background:var(--soft);color:var(--ink)"><b>Free demo.</b> Everything works with sample numbers. Backup, restore and CSV export are in the full app file (LedgerAndEase on Etsy).</div>' : '') +
      (storageOK ? '' : '<div class="banner">This browser is not saving your data (private window or blocked storage). Use Download backup in Setup so you do not lose your work.</div>') +
      '<header class="top"><div class="brand">Wedding Budget<small>Plan every payment · works offline · data stays on this device</small></div></header><nav class="tabs" aria-label="Pages">' +
      PAGES.map(function (p) { return '<button data-nav="' + p[0] + '"' + (p[0] === page ? ' aria-current="page"' : '') + '>' + p[1] + '</button>'; }).join('') + '</nav><main>' + fn() + '</main>';
    window.scrollTo(0, scroll); if (aid) { var el = document.getElementById(aid); if (el && el.tagName === 'INPUT') { el.focus(); } }
  }

  /* ---------- downloads ---------- */
  function download(name, text, type) {
    var blob = new Blob([text], { type: type || 'text/plain' }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function csv(rows) { return rows.map(function (r) { return r.map(function (c) { c = String(c == null ? '' : c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\r\n'); }
  function setPath(path, val) { var p = path.split('.'); S[p[0]][p[1]] = val; }

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var nav = e.target.closest('[data-nav]'); if (nav) { page = nav.getAttribute('data-nav'); render(); window.scrollTo(0, 0); return; }
    var el = e.target.closest('[data-act]'); if (!el) return;
    var a = el.getAttribute('data-act'), id = el.getAttribute('data-id'), pid = el.getAttribute('data-pid'), t = todayIso(), v = id ? vendorById(id) : null;
    function pay() { return v ? v.payments.filter(function (x) { return x.id === pid; })[0] : null; }
    switch (a) {
      case 'closeModal': closeModal(); break;
      case 'addVendor': editVendor(null); break; case 'editVendor': editVendor(id); break;
      case 'toggleV': openV[id] = !openV[id]; render(); break;
      case 'bookV': if (v) { v.status = 'booked'; save(); render(); } break;
      case 'delVendor': confirmBox('Delete this vendor?', 'The vendor and its payments are removed from your plan. This cannot be undone.', 'Delete', function () { S.vendors = S.vendors.filter(function (x) { return x.id !== id; }); save(); render(); }); break;
      case 'addPay': editPayment(id, null); break; case 'editPay': editPayment(id, pid); break;
      case 'delPay': confirmBox('Delete this payment?', 'It is removed from the payment schedule.', 'Delete', function () { v.payments = v.payments.filter(function (x) { return x.id !== pid; }); save(); render(); }); break;
      case 'markPaid': var p1 = pay(); if (p1) { p1.paid = true; p1.paidOn = t; save(); render(); } break;
      case 'unpaid': var p2 = pay(); if (p2) { p2.paid = false; delete p2.paidOn; save(); render(); } break;
      case 'addGift': editGift(null); break; case 'editGift': editGift(id); break;
      case 'giftGot': S.gifts.forEach(function (g) { if (g.id === id) g.received = true; }); save(); render(); break;
      case 'giftUndo': S.gifts.forEach(function (g) { if (g.id === id) g.received = false; }); save(); render(); break;
      case 'delGift': confirmBox('Delete this gift?', 'It will stop counting toward your savings.', 'Delete', function () { S.gifts = S.gifts.filter(function (g) { return g.id !== id; }); save(); render(); }); break;
      case 'addGuest': editGuest(null); break; case 'editGuest': editGuest(id); break;
      case 'delGuest': confirmBox('Remove this guest?', 'They are removed from your list.', 'Remove', function () { S.guestList = S.guestList.filter(function (g) { return g.id !== id; }); save(); render(); }); break;
      case 'rsvp': S.guestList.forEach(function (g) { if (g.id === id) g.rsvp = el.getAttribute('data-r'); }); save(); render(); break;
      case 'useGuests': S.wedding.guests = +el.getAttribute('data-n'); save(); render(); break;
      case 'useWhatIf': S.wedding.guests = whatIfG; whatIfG = null; save(); render(); break;
      case 'toggleTl': showAllTl = !showAllTl; render(); break;
      case 'affordClear': affordQ = null; render(); break;
      case 'affordAdd': if (affordQ) {
        var nv = { id: uid(), name: affordQ.name || 'New vendor', category: affordQ.category, status: el.getAttribute('data-st'), total: round2(affordQ.total), perGuest: 0, payments: [] };
        if (affordQ.deposit > 0) nv.payments.push({ id: uid(), label: 'Deposit', amount: round2(Math.min(affordQ.deposit, affordQ.total)), due: affordQ.depositDue, paid: false });
        nv.payments.push({ id: uid(), label: 'Final balance', amount: 0, due: affordQ.balanceDue, paid: false, balance: true }); S.vendors.push(nv); openV[nv.id] = true; affordQ = null; page = 'vendors'; save(); render(); } break;
      case 'suggestSplit': if (!(S.wedding.budget > 0)) { openModal('Enter your total budget first', '<p>The suggested split divides your total budget between the categories. Set your total budget in Setup first.</p>', null); break; }
        confirmBox('Suggest a split?', 'This fills every category budget with a typical share of your ' + mc(E.cents(S.wedding.budget)) + ' total (venue and catering get the most, with a buffer for surprises). It replaces any category amounts you typed. You can change each one afterwards.', 'Fill them in', function () { var sp = E.splitBudget(E.cents(S.wedding.budget)); E.CAT_NAMES.forEach(function (n) { S.categoryBudgets[n] = sp[n] / 100; }); save(); render(); }); break;
      case 'theme': S.settings.theme = el.getAttribute('data-t'); save(); render(); break;
      case 'loadExample': confirmBox('Load example data?', 'This replaces what is in the app now with a sample wedding. Download a backup first if you want to keep your own.', 'Load example', function () { S = exampleData(); save(); page = 'plan'; render(); }); break;
      case 'clearAll': confirmBox('Erase everything?', 'This removes all your data from this browser. This cannot be undone unless you have a backup.', 'Erase', function () { S = blank(); save(); page = 'plan'; render(); }); break;
      case 'backup': case 'restore': case 'csvPay': case 'csvGuests': if (DEMO) { openModal('Included in the full app', '<p>Backup, restore and CSV export are part of the full app file. This demo lets you try everything else.</p>', null); return; }
        if (a === 'backup') { var dl = function () { download('wedding-budget-backup-' + t + '.json', JSON.stringify(S, null, 1), 'application/json'); }; if (!S.vendors.length && !S.guestList.length) confirmBox('Nothing to back up yet', 'The app is empty right now, so this backup file would be empty too. Download it anyway?', 'Download anyway', dl); else dl(); }
        else if (a === 'restore') document.getElementById('restoreFile').click();
        else if (a === 'csvPay') download('wedding-payments.csv', csv([['Date', 'Vendor', 'Payment', 'Amount', 'Paid']].concat(E.calendar(S, t).map(function (x) { return [x.date, x.vendor, x.label, (x.amountC / 100).toFixed(2), x.paid ? 'yes' : 'no']; }))), 'text/csv');
        else download('wedding-guests.csv', csv([['Name', 'People', 'Answer']].concat(S.guestList.map(function (g) { return [g.name, g.count, g.rsvp]; }))), 'text/csv');
        break;
    }
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.id === 'restoreFile' && el.files && el.files[0]) {
      var rd = new FileReader();
      rd.onload = function () { try { var n = normalize(JSON.parse(rd.result)); confirmBox('Restore this backup?', (n.vendors.length || n.guestList.length ? 'This replaces the data in the app with the backup (' + n.vendors.length + ' vendors, ' + n.guestList.length + ' guest lines).' : 'This backup is EMPTY (0 vendors, 0 guest lines). Restoring it will erase what is in the app now. Cancel if you chose the wrong file.'), 'Restore', function () { S = n; save(); render(); }); } catch (err) { openModal('Could not restore', '<p>' + esc(err.message || 'The file could not be read.') + '</p>', null); } };
      rd.readAsText(el.files[0]); el.value = '';
    } else if (el.hasAttribute('data-catbudget')) { S.categoryBudgets[el.getAttribute('data-catbudget')] = Math.max(0, round2(num(el.value))); save(); render(); }
    else if (el.hasAttribute('data-set')) {
      var path = el.getAttribute('data-set'), val = el.type === 'date' ? (validDate(el.value) ? el.value : '') : (path === 'wedding.guests' ? Math.max(0, Math.floor(num(el.value))) : Math.max(0, round2(num(el.value))));
      setPath(path, val); save(); render();
    } else if (el.hasAttribute('data-cur')) { S.settings.currency = el.value.trim() || '$'; save(); render(); }
  });
  document.addEventListener('submit', function (e) {
    var f = e.target, k = f.getAttribute('data-form'); if (!k) return; e.preventDefault();
    if (k === 'afford') {
      var tot = num(f.total.value); if (!(tot > 0)) return;
      affordQ = { name: f.what.value.trim(), category: f.category.value, total: round2(tot), deposit: Math.max(0, round2(num(f.deposit.value))), depositDue: validDate(f.depositDue.value) ? f.depositDue.value : '', balanceDue: validDate(f.balanceDue.value) ? f.balanceDue.value : '' };
      render();
    } else if (k === 'whatif') { var g = Math.floor(num(f.g.value)); if (g >= 0) { whatIfG = g; render(); } }
  });

  S = load();
  if (DEMO && !S.vendors.length && !(S.wedding.budget > 0)) { S = exampleData(); save(); }
  render();
  window.__wba = { get state() { return S; }, render: render, setPage: function (p) { page = p; render(); } };
})();
</script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}</script></body></html>
